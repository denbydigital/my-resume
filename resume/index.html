<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Denby · IT Business Analyst</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/site.css">
<style>
  html, body { height: 100%; }
  body { background: var(--pine-50); }
  .cover {
    position: relative; min-height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    color: var(--fg-1);
    transition: opacity 420ms var(--ease-out), transform 520ms var(--ease-out);
  }
  body.leaving .cover { opacity: 0; transform: scale(1.015); }
.cover__inner { position: relative; z-index: 1; max-width: 760px; }
  .cover .anim { opacity: 0; transform: translateY(14px); animation: rise 720ms var(--ease-out) forwards; }
  .cover .a1 { animation-delay: 80ms; }
  .cover .a2 { animation-delay: 180ms; }
  .cover .a3 { animation-delay: 300ms; }
  .cover .a4 { animation-delay: 440ms; }
  .cover .a5 { animation-delay: 600ms; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .cover .anim { opacity: 1 !important; transform: none !important; animation: none !important; }
    body.leaving .cover { transition: none; }
  }

  .cover__mark { width: 58px; height: 58px; margin: 0 auto 30px; }
  .cover__eyebrow { color: var(--clay-600); margin-bottom: 22px; }
  .cover__name {
    font-family: var(--font-serif); font-weight: 500; font-size: clamp(52px, 11vw, 104px);
    line-height: 0.98; letter-spacing: -0.025em; margin: 0; color: var(--pine-900);
  }
  .cover__name .clay { color: var(--clay-600); }
  .cover__tag {
    font-size: clamp(17px, 2.4vw, 21px); line-height: 1.55; color: var(--fg-2);
    max-width: 52ch; margin: 26px auto 0;
  }
  .cover__enter {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; cursor: pointer;
    font-family: var(--font-sans); font-weight: 600; font-size: 16px;
    padding: 15px 30px; border-radius: var(--r-pill); border: none;
    background: var(--pine-600); color: #fff;
    transition: background var(--dur) var(--ease-out), transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
    box-shadow: 0 8px 24px rgba(184,34,105,0.25);
  }
  .cover__enter:hover { background: var(--pine-700); transform: translateY(-1px); }
  .cover__enter:active { transform: scale(0.98); }
  .cover__enter .ic { width: 18px; height: 18px; transition: transform var(--dur) var(--ease-out); }
  .cover__enter:hover .ic { transform: translateX(3px); }

  .cover__meta {
    position: absolute; bottom: 30px; left: 0; right: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-3);
  }
  .cover__meta i { width: 3px; height: 3px; border-radius: 999px; background: var(--clay-400); display: inline-block; }
  .cover__portrait {
    width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
    margin: 0 auto 26px;
    border: 3px solid #fff;
    box-shadow: 0 4px 20px rgba(184,34,105,0.18);
  }
  .cover__portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; display: block; }

  @media (max-width: 600px) { .cover__meta { position: static; margin-top: 48px; } }

  /* ambient orbs */
  .cover__orb {
    position: absolute; border-radius: 50%; pointer-events: none;
    filter: blur(80px); will-change: transform;
  }
  .cover__orb.o1 {
    width: 560px; height: 560px; background: var(--pine-200); opacity: 0.55;
    top: -15%; left: -18%; animation: orb1 22s ease-in-out infinite;
  }
  .cover__orb.o2 {
    width: 380px; height: 380px; background: var(--clay-200); opacity: 0.5;
    top: 5%; right: -12%; animation: orb2 28s ease-in-out infinite;
  }
  .cover__orb.o3 {
    width: 300px; height: 300px; background: var(--pine-300); opacity: 0.38;
    bottom: 8%; left: 28%; animation: orb3 18s ease-in-out infinite;
  }
  @keyframes orb1 {
    0%,100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(50px,-40px) scale(1.06); }
    66%      { transform: translate(-30px,25px) scale(0.96); }
  }
  @keyframes orb2 {
    0%,100% { transform: translate(0,0) scale(1); }
    40%     { transform: translate(-45px,35px) scale(1.05); }
    75%     { transform: translate(22px,-22px) scale(0.97); }
  }
  @keyframes orb3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-28px,-38px) scale(1.09); }
  }
  @media (prefers-reduced-motion: reduce) { .cover__orb { animation: none; } }
</style>
</head>
<body>
  <main class="cover" id="cover">
    <div class="cover__orb o1" aria-hidden="true"></div>
    <div class="cover__orb o2" aria-hidden="true"></div>
    <div class="cover__orb o3" aria-hidden="true"></div>
    <div class="cover__inner">
      <div class="cover__portrait anim a1" aria-hidden="true">
        <img src="assets/headshot.jpg" alt="Laura Denby">
      </div>
      <div class="eyebrow cover__eyebrow anim a2">IT Business Analyst &nbsp;·&nbsp; Sydney, Australia</div>
      <h1 class="cover__name anim a3">Laura <span class="clay">Denby</span></h1>
      <p class="cover__tag anim a4">
        Thirteen years turning complex business needs into intuitive, impactful digital
        products, with AI built into every step of the practice.
      </p>
      <button class="cover__enter anim a5" id="enter" aria-label="Enter portfolio">
        Enter portfolio <i class="ic" data-lucide="arrow-right"></i>
      </button>
    </div>
    <div class="cover__meta anim a5">
      <span>13 years</span><i></i><span>Agile · Scrum</span><i></i><span>AI-assisted delivery</span>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="sparkle.js"></script>
  <script>
    lucide.createIcons();
    // Safety net: guarantee content is visible even if entrance animation never runs.
    setTimeout(function () {
      document.querySelectorAll('.cover .anim').forEach(function (e) { e.style.opacity = 1; e.style.transform = 'none'; });
    }, 1500);
    function enter() {
      document.body.classList.add('leaving');
      setTimeout(function () { window.location.href = 'about.html'; }, 440);
    }
    document.getElementById('enter').addEventListener('click', enter);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
    });

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Magnetic CTA button
    if (!reduced) {
      var btn = document.getElementById('enter');
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        var x = (e.clientX - r.left - r.width  / 2) * 0.28;
        var y = (e.clientY - r.top  - r.height / 2) * 0.28;
        btn.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      });
      btn.addEventListener('mouseleave', function () {
        btn.style.transform = '';
      });
    }
  </script>
</body>
</html>
