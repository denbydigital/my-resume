<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:9px; }
  .bar { height:16px; background:var(--clay-300); border-radius:3px; }
  .tok { font-family:var(--font-mono); font-size:11px; color:var(--fg-2); width:90px; }
</style>
</head>
<body>
  <div class="name">Spacing scale — 4px base</div>
  <div id="s"></div>
  <script>
    const sp=[['1',4],['2',8],['3',12],['4',16],['5',24],['6',32],['7',48],['8',64]];
    document.getElementById('s').innerHTML=sp.map(([k,v])=>
      `<div class="row"><div class="tok">--sp-${k} · ${v}px</div><div class="bar" style="width:${v}px"></div></div>`).join('');
  </script>
</body>
</html>
