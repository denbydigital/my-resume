<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:6px; }
  .sub { font-family:var(--font-sans); font-size:12.5px; color:var(--fg-3); margin-bottom:16px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .opt { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .swrow { display:flex; height:46px; }
  .swrow span { flex:1; }
  .cap { padding:8px 12px; }
  .cap b { font-family:var(--font-sans); font-size:12.5px; color:var(--fg-1); }
  .cap em { font-family:var(--font-sans); font-style:normal; font-size:11px; color:var(--fg-3); display:block; margin-top:2px; }
</style>
</head>
<body>
  <div class="name">Color exploration — alternate accents on Stone</div>
  <div class="sub">Pine + Clay is the committed default. Two other directions if you want to lean differently:</div>
  <div class="row">
    <div class="opt">
      <div class="swrow"><span style="background:#185849"></span><span style="background:#BD5B3D"></span><span style="background:#FBF9F5"></span></div>
      <div class="cap"><b>Pine + Clay</b><em>Default · calm + warm</em></div>
    </div>
    <div class="opt">
      <div class="swrow"><span style="background:#22344F"></span><span style="background:#C2873B"></span><span style="background:#FBF9F5"></span></div>
      <div class="cap"><b>Navy + Amber</b><em>More corporate, classic</em></div>
    </div>
    <div class="opt">
      <div class="swrow"><span style="background:#3C3A52"></span><span style="background:#C26B7A"></span><span style="background:#FBF9F5"></span></div>
      <div class="cap"><b>Slate + Rose</b><em>Softer, more personal</em></div>
    </div>
  </div>
</body>
</html>
