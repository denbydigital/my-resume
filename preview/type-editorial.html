<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background:var(--bg); display:flex; flex-direction:column; gap:20px; }
  .tag { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); margin-top:8px; }
</style>
</head>
<body>
  <div>
    <span style="font-family:var(--font-serif);font-size:26px;color:var(--fg-1)">These days I help teams</span>
    <span class="serif-italic" style="font-size:26px;color:var(--clay-600)">skip the mistakes</span>
    <span style="font-family:var(--font-serif);font-size:26px;color:var(--fg-1)">I already made.</span>
    <div class="tag">Serif italic for warm editorial emphasis</div>
  </div>
  <div>
    <p style="margin:0">Roll back a deploy with <code>git revert</code> and the pipeline picks it up automatically.</p>
    <div class="tag">Inline code · IBM Plex Mono on pine-50</div>
  </div>
</body>
</html>
