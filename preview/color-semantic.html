<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .item { display:flex; flex-direction:column; gap:8px; }
  .chip { height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-sans); font-weight:600; font-size:13px; }
  .meta b { font-family:var(--font-sans); font-size:13px; color:var(--fg-1); text-transform:capitalize; }
  .meta span { font-family:var(--font-mono); font-size:10.5px; color:var(--fg-3); display:block; margin-top:2px; }
</style>
</head>
<body>
  <div class="name">Semantic — hue-tuned to live beside Pine & Clay</div>
  <div class="grid">
    <div class="item"><div class="chip" style="background:#E6F1EA;color:#2F7D5B">Success</div><div class="meta"><b>success</b><span>#2F7D5B</span></div></div>
    <div class="item"><div class="chip" style="background:#F7ECD6;color:#9A6815">Warning</div><div class="meta"><b>warning</b><span>#C98A2B</span></div></div>
    <div class="item"><div class="chip" style="background:#F7E2DB;color:#B4472F">Error</div><div class="meta"><b>error</b><span>#B4472F</span></div></div>
    <div class="item"><div class="chip" style="background:#E0EDF2;color:#2E6F8E">Info</div><div class="meta"><b>info</b><span>#2E6F8E</span></div></div>
  </div>
</body>
</html>
