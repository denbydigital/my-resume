<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

<body>
  <div class="stack">
    <div>
      <h3 style="margin:0">Architecture reviews & roadmaps</h3>
      <div class="tag">Hanken Grotesk · 600 · 24px · h3</div>
    </div>
    <div>
      <h4 style="margin:0">Sequenced, without stopping the line</h4>
      <div class="tag">Hanken Grotesk · 600 · 19px · h4</div>
    </div>
    <div>
      <div class="eyebrow">What I do</div>
      <div class="tag">IBM Plex Mono · 500 · 12.5px · uppercase · eyebrow</div>
    </div>
  </div>

</html>
