<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background:var(--bg); }
  .row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .tag { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); letter-spacing:.04em; }
  .stack { display:flex; flex-direction:column; gap:18px; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="display">Ship the right thing</div>
      <div class="tag">Newsreader · 500 · 64px · display</div>
    </div>
    <div>
      <h1 style="margin:0">A clear-eyed read on your platform</h1>
      <div class="tag">Newsreader · 500 · 44px · h1</div>
    </div>
    <div>
      <h2 style="margin:0">What it's like to work together</h2>
      <div class="tag">Newsreader · 500 · 32px · h2</div>
    </div>
  </div>
</body>
</html>
