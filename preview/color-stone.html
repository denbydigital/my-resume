<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:14px; }
  .scale { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:56px; border-radius:8px; border:1px solid rgba(33,30,24,.06); }
  .lab { font-family:var(--font-mono); font-size:9.5px; color:var(--fg-3); text-align:center; line-height:1.3; }
  .lab b { display:block; color:var(--fg-2); font-weight:600; }
</style>
</head>
<body>
  <div class="name">Stone — warm neutral · backbone</div>
  <div class="scale" id="s"></div>
  <script>
    const stone={50:'#FBF9F5',100:'#F4EFE7',200:'#E9E1D5',300:'#D8CDBC',400:'#B9AD99',500:'#948A78',600:'#6E6657',700:'#514B40',800:'#353129',900:'#211E18'};
    document.getElementById('s').innerHTML=Object.entries(stone).map(([k,v])=>
      `<div class="sw"><div class="chip" style="background:${v}"></div><div class="lab"><b>${k}</b>${v.slice(1)}</div></div>`).join('');
  </script>
</body>
</html>
