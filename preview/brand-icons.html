<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:26px 32px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:6px; }
  .sub { font-family:var(--font-sans); font-size:12.5px; color:var(--fg-3); margin-bottom:20px; }
  .row { display:flex; gap:30px; flex-wrap:wrap; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:9px; }
  .ic svg { width:26px; height:26px; color:var(--pine-700); stroke-width:1.75; }
  .ic span { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); }
</style>
</head>
<body>
  <div class="name">Iconography — Lucide · 1.75 stroke</div>
  <div class="sub">Functional line icons, currentColor, paired with labels. No emoji.</div>
  <div class="row">
    <div class="ic"><i data-lucide="compass"></i><span>compass</span></div>
    <div class="ic"><i data-lucide="git-branch"></i><span>git-branch</span></div>
    <div class="ic"><i data-lucide="layers"></i><span>layers</span></div>
    <div class="ic"><i data-lucide="gauge"></i><span>gauge</span></div>
    <div class="ic"><i data-lucide="users"></i><span>users</span></div>
    <div class="ic"><i data-lucide="route"></i><span>route</span></div>
    <div class="ic"><i data-lucide="message-circle"></i><span>message</span></div>
    <div class="ic"><i data-lucide="calendar-check"></i><span>calendar</span></div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
