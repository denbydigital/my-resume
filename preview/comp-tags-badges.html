<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:18px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .tag { font-family:var(--font-sans); font-size:13px; font-weight:500; padding:5px 13px; border-radius:999px; background:var(--stone-100); color:var(--fg-2); border:1px solid var(--stone-200); }
  .tag.pine { background:var(--pine-50); color:var(--pine-700); border-color:transparent; }
  .tag.clay { background:var(--clay-50); color:var(--clay-700); border-color:transparent; }
  .badge { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-sans); font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:6px; }
  .badge::before { content:''; width:6px; height:6px; border-radius:999px; background:currentColor; }
</style>
</head>
<body>
  <div class="name">Tags & badges</div>
  <div class="row">
    <span class="tag pine">Platform strategy</span>
    <span class="tag">Architecture</span>
    <span class="tag clay">Delivery</span>
    <span class="tag">Team coaching</span>
  </div>
  <div class="row">
    <span class="badge" style="background:#E6F1EA;color:#2F7D5B">Available</span>
    <span class="badge" style="background:#F7ECD6;color:#9A6815">In progress</span>
    <span class="badge" style="background:#F7E2DB;color:#B4472F">At risk</span>
    <span class="badge" style="background:#E0EDF2;color:#2E6F8E">Scoping</span>
  </div>
</body>
</html>
