<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 32px; background:var(--bg); }
  table { border-collapse:collapse; width:100%; }
  td { padding:9px 0; border-bottom:1px solid var(--border); vertical-align:baseline; }
  td.spec { font-family:var(--font-mono); font-size:11.5px; color:var(--fg-3); text-align:right; white-space:nowrap; width:1%; padding-left:18px; }
  .s { color:var(--fg-1); }
</style>
</head>
<body>
  <table>
    <tr><td class="s" style="font-family:var(--font-serif);font-weight:500;font-size:40px;line-height:1">Display</td><td class="spec">64 / serif 500</td></tr>
    <tr><td class="s" style="font-family:var(--font-serif);font-weight:500;font-size:32px;line-height:1">Heading 1</td><td class="spec">44 / serif 500</td></tr>
    <tr><td class="s" style="font-family:var(--font-serif);font-weight:500;font-size:26px;line-height:1">Heading 2</td><td class="spec">32 / serif 500</td></tr>
    <tr><td class="s" style="font-family:var(--font-sans);font-weight:600;font-size:22px;line-height:1">Heading 3</td><td class="spec">24 / sans 600</td></tr>
    <tr><td class="s" style="font-family:var(--font-sans);font-weight:600;font-size:18px;line-height:1">Heading 4</td><td class="spec">19 / sans 600</td></tr>
    <tr><td class="s" style="font-family:var(--font-sans);font-weight:400;font-size:16px;line-height:1">Body</td><td class="spec">16 / sans 400</td></tr>
    <tr><td class="s" style="font-family:var(--font-sans);font-weight:400;font-size:13px;line-height:1;color:var(--fg-3)">Caption</td><td class="spec">13 / sans 400</td></tr>
    <tr><td style="font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)">Eyebrow</td><td class="spec">12.5 / mono 500</td></tr>
  </table>
</body>
</html>
