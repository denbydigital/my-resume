<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg); }
  .name { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); margin-bottom:14px; }
  .name b { color:var(--clay-600); }
  .scale { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:56px; border-radius:8px; border:1px solid rgba(33,30,24,.06); position:relative; }
  .chip.base::after { content:'BASE'; position:absolute; left:6px; top:6px; font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; color:#fff; opacity:.9; }
  .lab { font-family:var(--font-mono); font-size:9.5px; color:var(--fg-3); text-align:center; line-height:1.3; }
  .lab b { display:block; color:var(--fg-2); font-weight:600; }
</style>
</head>
<body>
  <div class="name">Clay — <b>accent</b> · warm terracotta · the human note (use sparingly)</div>
  <div class="scale" id="s"></div>
  <script>
    const clay={50:'#FBEFE9',100:'#F6D8C9',200:'#EDB69E',300:'#E0906E',400:'#D0714B',500:'#BD5B3D',600:'#A24A30',700:'#823A26',800:'#5F2B1D',900:'#3F1D14'};
    document.getElementById('s').innerHTML=Object.entries(clay).map(([k,v])=>
      `<div class="sw"><div class="chip ${k==500?'base':''}" style="background:${v}"></div><div class="lab"><b>${k}</b>${v.slice(1)}</div></div>`).join('');
  </script>
</body>
</html>
